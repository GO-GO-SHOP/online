<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="2;url=https://gogoshop.nz/pos.html">
  <link rel="canonical" href="https://gogoshop.nz/pos.html">
  <title>GO GO SHOP POS</title>
  <script>
    (async function redirectToCanonicalStore() {
      const target = new URL("https://gogoshop.nz/pos.html");
      target.search = location.search;
      target.hash = location.hash;

      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
      } catch (error) {}

      location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>GO GO SHOP POS has moved to <a href="https://gogoshop.nz/pos.html">gogoshop.nz</a>.</p>
</body>
</html>
